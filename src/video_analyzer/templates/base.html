<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Philm{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: 14px;
    }
    nav {
      padding: 16px 24px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    nav a { color: #e0e0e0; text-decoration: none; }
    nav .logo { font-size: 18px; font-weight: bold; letter-spacing: 2px; }
    main { padding: 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }
    .card {
      background: #111;
      border: 1px solid #222;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: #444; }
    .card-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: #1a1a1a;
      object-fit: cover;
    }
    .card-thumb-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      font-size: 11px;
    }
    .card-body { padding: 12px; }
    .card-filename { font-size: 11px; color: #666; margin-bottom: 6px; }
    .card-desc { font-size: 12px; color: #bbb; line-height: 1.5; margin-bottom: 10px; }
    .coverage {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .pill {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 2px;
      border: 1px solid #333;
      color: #555;
      cursor: pointer;
      transition: all 0.1s;
    }
    .pill.done { border-color: #4a9; color: #4a9; }
    .pill.running { border-color: #a84; color: #a84; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .search-bar {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    input[type=text], input[type=search] {
      background: #111;
      border: 1px solid #333;
      color: #e0e0e0;
      padding: 8px 12px;
      font-family: monospace;
      font-size: 13px;
      border-radius: 2px;
      outline: none;
    }
    input:focus { border-color: #555; }
    button {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #e0e0e0;
      padding: 8px 16px;
      font-family: monospace;
      font-size: 13px;
      cursor: pointer;
      border-radius: 2px;
    }
    button:hover { border-color: #555; }
    .drop-zone {
      border: 1px dashed #333;
      border-radius: 4px;
      padding: 24px;
      text-align: center;
      color: #444;
      margin-top: 16px;
      transition: border-color 0.15s, color 0.15s;
    }
    .drop-zone.drag-over { border-color: #4a9; color: #4a9; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo">PHILM</a>
    <a href="/">corpus</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
<script>
// Event delegation — survives HTMX swaps
document.addEventListener('click', async (e) => {
  const pill = e.target.closest('.pill[data-mode]');
  if (!pill) return;
  e.stopPropagation();

  const videoId = pill.dataset.videoId;
  const mode = pill.dataset.mode;
  if (pill.classList.contains('done') || pill.classList.contains('running')) return;

  // Optimistically flip to running
  pill.classList.add('running');
  delete pill.dataset.mode; // prevent double-click

  // Fire the analysis job
  await fetch(`/api/analyze/${videoId}/${mode}`, { method: 'POST' });

  // Poll status every 3s, swap card when done
  const poll = setInterval(async () => {
    try {
      const res = await fetch(`/api/analyze/status/${videoId}/${mode}`);
      const { running } = await res.json();
      if (!running) {
        clearInterval(poll);
        const cardRes = await fetch(`/api/card/${videoId}`);
        const html = await cardRes.text();
        const card = document.getElementById(`card-${videoId}`);
        if (card) card.outerHTML = html;
      }
    } catch (_) { clearInterval(poll); }
  }, 3000);
});
</script>
</body>
</html>

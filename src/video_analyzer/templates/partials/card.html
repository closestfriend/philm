<div class="card" id="card-{{ video.id }}" data-href="/video/{{ video.id }}" onclick="if(!event.target.closest('[data-mode]'))window.location=this.dataset.href">
  {% if video.thumbnail %}
    <img class="card-thumb" src="/thumbnails/{{ video.id }}.jpg" alt="">
  {% else %}
    <div class="card-thumb-placeholder">no thumbnail</div>
  {% endif %}
  <div class="card-body">
    <div class="card-filename">{{ video.filename }}</div>
    <div class="card-desc">{{ video.description or '—' }}</div>
    <div class="coverage">
      {% for mode, done in video.coverage.items() %}
        <span class="pill {{ 'done' if done else '' }}"
          id="pill-{{ video.id }}-{{ mode }}"
          {% if not done %}
            data-video-id="{{ video.id }}"
            data-mode="{{ mode }}"
          {% endif %}
        >{{ mode }}</span>
      {% endfor %}
    </div>
  </div>
</div>
